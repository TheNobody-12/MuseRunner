[project]
name = "muserunner"
version = "0.1.0"
description = "A verifiable, zero-trust AI quality engineering control plane"
readme = "README.md"
authors = [
    { name = "TheNobody-12", email = "sarthak.kce20@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "langgraph>=1.2.18",
    "openai>=3.39.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
